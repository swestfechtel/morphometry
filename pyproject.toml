# Pytest configuration. The runtime environment is pinned by requirements.txt.
[tool.pytest.ini_options]
testpaths = ["tests", "api/tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "needs_augsburg: requires the Augsburg PA000001 sample segmentations",
    "needs_augsburg_reader_study: requires the Augsburg reader-study segmentations (MORPH_AUGSBURG_READER_STUDY)",
    "needs_augsburg_large: requires the Augsburg large-cohort segmentations (MORPH_AUGSBURG_LARGE_DIR)",
    "needs_nako: requires the NaKo sample hip segmentations",
    "needs_ct: requires a whole-leg CT segmentation (MORPH_CT_SAMPLE)",
    "needs_dfg_knees: requires the dfg_knees knee segmentations (MORPH_DFG_KNEES_DIR)",
    "stochastic: result depends on a stochastic method; assert structure/ranges, not exact values",
    "needs_redis: requires a real Redis (uses fakeredis otherwise)",
]
