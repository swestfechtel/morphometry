  <ellipse class="bone" cx="150.0" cy="150.0" rx="28.0" ry="33.0"/>
  <ellipse class="bone" cx="214.0" cy="150.0" rx="28.0" ry="33.0"/>
  <line class="A" x1="116.0" y1="180.0" x2="250.0" y2="180.0"/>
  <circle class="ptl" cx="116.0" cy="180.0" r="4"/>
  <circle class="ptl" cx="250.0" cy="180.0" r="4"/>
  <ellipse class="bone" cx="182.0" cy="262.0" rx="74.0" ry="30.0"/>
