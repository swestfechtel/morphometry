  <circle class="ptl" cx="116.0" cy="240.0" r="4"/>
  <circle class="ptl" cx="250.0" cy="250.0" r="4"/>
  <line class="C" x1="150.0" y1="210.0" x2="285.0" y2="210.0"/>
