name: version-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # stdlib only: versioning/ must not import third-party packages.
      - name: Check version rules
        run: python scripts/check_version.py
